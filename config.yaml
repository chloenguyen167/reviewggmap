# =====================================================================
# Cấu hình chính — Phát hiện đánh giá giả mạo trên Google Maps (VN)
# Mọi ngưỡng / trọng số / đường dẫn đều nằm ở đây, không hard-code.
# =====================================================================

project:
  seed: 42
  timezone: Asia/Ho_Chi_Minh
  salt_env: REVIEWER_SALT        # biến môi trường chứa salt để hash reviewer

paths:
  root: data                     # mọi đường dẫn bên dưới là tương đối so với root
  raw: raw
  interim: interim
  processed: processed
  labels: labels
  benchmark: benchmark
  models: models
  reports: ../reports            # hình/bảng cho paper
  logs: ../logs

# ---------------------------------------------------------------------
# A. THU THẬP
# ---------------------------------------------------------------------
collect:
  source: playwright             # playwright | serpapi
  places_file: raw/places/places_selected.csv

  retry_coverage: 0.95           # lấy lại địa điểm đạt < 95% số review Google báo
  retry_attempts: 2              # số lần thử lại tối đa mỗi địa điểm
  min_coverage: 0.5              # parse LOẠI địa điểm lấy được < 50% số review Google báo (mẫu bị chọn lệch)
  place_filter:                  # tiêu chí A1
    min_reviews: 100
    max_reviews: 3000

  search_queries:                # dùng cho bước tìm địa điểm (cả 2 nguồn)
    - "quán cà phê quận 1 TP.HCM"
    - "quán cà phê quận 3 TP.HCM"
    - "nhà hàng quận 1 TP.HCM"
    - "quán ăn Bình Thạnh TP.HCM"
    - "spa thẩm mỹ quận 10 TP.HCM"
    - "khách sạn quận 1 TP.HCM"
  max_results_per_query: 30

  playwright:
    headless: true
    user_data_dir: .chrome_profile_gc          # đường dẫn profile Chrome đã đăng nhập (nếu bị "xem giới hạn")
    executable_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"        # để trống = Chromium của Playwright
    lang: vi
    viewport: {width: 1280, height: 900}
    max_reviews_per_place: 3000
    max_idle_rounds: 25          # số vòng cuộn liên tiếp không có review mới thì dừng
    scroll_pause_ms: [800, 1600]
    delay_between_places_s: [20, 45]
    nav_timeout_ms: 45000
    capture_network: true
    network_url_keywords: ["listugcposts", "listentitiesreviews", "MapsWizUi/data/batchexecute"]   # 2026: review tải qua batchexecute
    # Selector: Google hay đổi tên class. Mỗi mục là danh sách phương án thử lần lượt.
    selectors:
      consent_accept: ['button:has-text("Chấp nhận tất cả")', 'button:has-text("Accept all")', 'form[action*="consent"] button']
      reviews_tab: ['button[role="tab"]:has-text("Bài đánh giá")', 'button[role="tab"]:has-text("Reviews")', 'button[aria-label*="Bài đánh giá"]', 'button[aria-label*="Reviews"]']
      sort_button: ['button[aria-label*="Sắp xếp"]', 'button[aria-label*="Sort"]', 'button:has-text("Sắp xếp")']
      sort_newest: ['div[role="menuitemradio"]:has-text("Mới nhất")', 'div[role="menuitemradio"]:has-text("Newest")', 'li[role="menuitemradio"]:nth-child(2)']
      review_card: 'div.jftiEf[data-review-id], div[data-review-id][aria-label]'
      more_button: 'button.w8nwRe, button[aria-label="Xem thêm"], button[aria-label="See more"], button[jsaction*="review.expandReview"]'
      name: '.d4r55'
      meta: '.RfnDt'
      stars: 'span[role="img"][aria-label], .kvMYJc'
      stars_alt: '.fzvQIb'
      date: '.rsqaWe, .xRkPPb'
      text: '.wiI7pd, .MyEned'
      owner_response: '.CDe7pd'
      photo: 'button.Tya61d'
      profile_link: 'button[data-href*="/contrib/"], a[href*="/contrib/"]'
      results_feed: 'div[role="feed"]'
      result_link: 'a.hfpxzc'
      result_rating: 'span.MW4etd'
      result_count: 'span.UY7F9'

  serpapi:
    api_key_env: SERPAPI_KEY
    hl: vi
    sort_by: newestFirst
    max_calls: 1500
    empty_page_retries: 3

  contributors:
    top_n: 300                   # chỉ lấy lịch sử cho N reviewer nghi vấn nhất
    max_reviews_each: 200

  http:
    timeout_s: 10
    max_retries: 5
    backoff_base_s: 2

# ---------------------------------------------------------------------
# B. TIỀN XỬ LÝ
# ---------------------------------------------------------------------
preprocess:
  teencode_file: resources/teencode_vi.txt
  word_segment: pyvi             # pyvi | none
  drop_future_dates: true

# ---------------------------------------------------------------------
# C. CÁC MODULE
# ---------------------------------------------------------------------
m1a:                             # near-duplicate
  min_words: 8
  shingle_k: 3
  num_perm: 128
  lsh_threshold: 0.5
  sim_threshold: 0.6             # Jaccard (hoặc cosine) tối thiểu để coi là gần trùng
  use_embeddings: false          # bật nếu có sentence-transformers + model tải được
  embedding_model: bkai-foundation-models/vietnamese-bi-encoder
  embedding_threshold: 0.92
  embedding_neighbors: 10

m1b:                             # content-spam classifier
  mode: rules                    # auto | model | rules — RULES: mô hình học từ ViSpamReviews (TMĐT) lệch miền nặng
                                 # trên Google Maps (xem reports/tables/m1b_label_variants.csv) → không dùng để chấm/đánh giá
  benchmark_dir: vispamreviews_v2
  text_col: comment              # ViSpamReviews v2: comment = nội dung review (KHÔNG phải description = mô tả sản phẩm)
  label_col: label               # 0/1; spam_label (0–3) là loại spam
  spam_positive_values: [1, "1", "spam", "SPAM"]
  drop_values: []                # vd. [2] với label_col: spam_label → bỏ loại "chỉ nói về shop/giao hàng" (xem m1b_label_variants.csv)
  model_file: m1b_tfidf_lr.joblib
  C_grid: [0.25, 1.0, 4.0]
  ad_keywords: ["liên hệ", "zalo", "inbox", "khuyến mãi", "giảm giá", "ghé shop", "đặt hàng", "hotline", "follow", "link", "mã giảm", "voucher", "sale"]

m2:                              # temporal burst
  freq: D                        # D (ngày) | W (tuần) — W khi phần lớn chỉ có ngày tương đối
  window: 28                     # số bước thời gian làm baseline (28 ngày / 8 tuần)
  min_count: 3                   # số review tối thiểu trong 1 ngày để gắn cờ theo z
  z_threshold: 3.0
  contamination: 0.02
  if_min_count: 2                # IF chỉ gắn cờ ngày có ≥ 2 review
  expand: 1                      # mở rộng ±1 bước quanh ngày burst
  min_active_steps: 60           # quán có ít hơn số bước có review này → bỏ z, chỉ dùng IF
  new_account_max_reviews: 3
  coord_window_days: 14          # M2b: bản gần trùng ở quán khác đăng trong ±N ngày → phối hợp liên quán

m3:                              # behavioral
  contamination: 0.05
  new_account_max_reviews: 3

# ---------------------------------------------------------------------
# FUSION
# ---------------------------------------------------------------------
fusion:
  method: fisher                 # mean | fisher | max (xem src/fusion/score.py)
  weights: {dup: 1.0, content: 1.0, burst: 1.0, coord: 1.0, behav: 1.0}
  zones:
    high_quantile: 0.98          # >= → auto_flag
    low_quantile: 0.90           # >= → review ; còn lại → safe
  reason_min_score: 0.8

# ---------------------------------------------------------------------
# D. ĐÁNH GIÁ
# ---------------------------------------------------------------------
evaluation:
  group_a_top_per_module: 60
  group_b_random: 300            # Nhóm B lớn để khoảng tin cậy của tỷ lệ nền đọc được (80 mẫu → Wilson 1,3–10,5%)
  pilot_n: 30
  human_a_n: 60                  # 2 người gán TOÀN BỘ Nhóm B + human_a_n mục Nhóm A; Claude gán toàn bộ Nhóm A
                                 # (60 mục chung với người dùng để kiểm chứng người–Claude)
  kappa_min: 0.6
  llm_max_kappa_gap: 0.10        # dùng nhãn Claude nếu κ(người–Claude) ≥ kappa_min VÀ ≥ κ(A–B) − gap
  llm:                           # Claude trên claude.ai (không dùng API): --stages llm_export → chat → llm_import
    batch_size: 40               # số mục mỗi file upload (nhỏ để Claude không bỏ sót dòng)
    similar_k: 5                 # số review giống nhất (TF-IDF) đưa cho Claude để xét cờ f3 (tương đương Ctrl+F)
  k_list: [25, 50, 100, 150]
  k_list_human: [25, 50]         # P@K trên phần nhãn NGƯỜI (số chính)
  k_list_extended: [100, 150]    # mở rộng trên nhãn người + Claude (ghi rõ nguồn)
  bootstrap: 1000
  cv_folds: 5
  sensitivity:
    m1a.lsh_threshold: [0.4, 0.5, 0.6]
    m2.contamination: [0.01, 0.02, 0.05]
    m2.window: [14, 28, 56]
    m2.coord_window_days: [7, 14, 30]

# ---------------------------------------------------------------------
# CÔNG CỤ GÁN NHÃN THEO QUÁN (src/labeltool) — --stages labeltool_all
# ---------------------------------------------------------------------
labeltool:
  output: labeltool/gan_nhan_review.html   # tương đối so với paths.labels; 1 file HTML chứa đủ dữ liệu
  image_hash:
    thumb: "=w64-h64-k-no"       # kích thước ảnh tải về để băm (~3 KB/ảnh)
    workers: 32
    hash_max_dist: 6             # Hamming tối đa (mỗi chiều dHash) để coi 2 ảnh là một
    min_bits: 8                  # bỏ ảnh gần như phẳng (ít thông tin, dễ ghép nhầm)
    max_bucket: 3000
  burst:                         # gợi ý f6 hiển thị trong công cụ (giống luật trong huong_dan_gan_nhan.md)
    min_count: 5
    ratio: 3.0
