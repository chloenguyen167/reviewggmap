<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Gắn nhãn review Google Maps</title>
<style>
:root{--blue:#1a73e8;--blue-l:#e8f0fe;--txt:#202124;--sub:#70757a;--line:#dadce0;--bg:#f1f3f4;--star:#fbbc04;
  --g:#188038;--g-l:#e6f4ea;--u:#b06000;--u-l:#fef7e0;--s:#d93025;--s-l:#fce8e6;--side:340px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}
.muted{color:var(--sub)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:#dadce0}

/* ---- khung ---- */
#top{position:fixed;inset:0 0 auto 0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:20}
#top .logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500;white-space:nowrap}
#top .logo .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ea4335;position:relative}
#top .logo .pin:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
#top .grow{flex:1}
#top .who{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:4px 6px 4px 12px}
#top .who b{font-weight:500}
.btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;color:var(--txt);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f8f9fa}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1765cc}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--s);color:#fff;font-size:12px;text-align:center}
#prog{font-size:13px;color:var(--sub);white-space:nowrap}
#app{position:fixed;inset:56px 0 0 0;display:flex}
#side{width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main{flex:1;overflow-y:auto;min-width:0}
#mainIn{max-width:860px;margin:0 auto;padding:16px 20px 80px}

/* ---- danh sách quán ---- */
#side .sh{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:24px;padding:7px 14px;background:#fff;box-shadow:0 1px 2px rgba(60,64,67,.15)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent}
#side .sact{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
#plist{overflow-y:auto;flex:1}
.pgrp{padding:10px 14px 4px;font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;background:#fff;z-index:1;cursor:pointer;user-select:none}
.pitem{display:flex;gap:10px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;align-items:flex-start}
.pitem:hover{background:#f8f9fa}
.pitem.sel{background:var(--blue-l);border-left-color:var(--blue)}
.pitem input{margin-top:3px;cursor:pointer}
.pitem .pi{flex:1;min-width:0}
.pitem .pn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pm{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
.pbar{height:4px;background:#e8eaed;border-radius:2px;margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g)}

/* ---- đầu trang quán ---- */
.phead{background:#fff;border-radius:12px;border:1px solid var(--line);padding:18px 20px;margin-bottom:12px}
.phead h1{font-size:22px;font-weight:400;margin:0 0 2px}
.phead .cat{color:var(--sub);font-size:13px}
.ov{display:flex;gap:28px;margin-top:14px;flex-wrap:wrap}
.hist{flex:1;min-width:220px}
.hrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);cursor:pointer;padding:1px 0}
.hrow:hover .hb{background:#e2e5e9}
.hrow.on{color:var(--blue);font-weight:500}
.hb{flex:1;height:8px;background:#e8eaed;border-radius:4px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--star);border-radius:4px}
.big{text-align:center;min-width:110px}
.big .n{font-size:44px;line-height:1.1}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:3px 10px;font-size:12.5px}
.stat b{font-weight:500}
.tl{margin-top:14px}
.tl svg{width:100%;height:84px;display:block}
.tl rect.b{fill:#aecbfa;cursor:pointer}
.tl rect.b:hover,.tl rect.b.on{fill:var(--blue)}
.tl rect.sp{fill:var(--s);pointer-events:none}
.tl text{font-size:10px;fill:var(--sub)}
.tl .cap{font-size:12px;color:var(--sub);display:flex;justify-content:space-between}

/* ---- thanh lọc ---- */
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
#bar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:13px;color:var(--txt);white-space:nowrap;user-select:none}
.chip:hover{background:#f8f9fa}
.chip.on{background:var(--blue-l);border-color:#d2e3fc;color:#174ea6}
.chip .x{margin-left:4px;color:var(--sub)}
select.chip{padding:4px 8px}
#count{font-size:13px;color:var(--sub);margin-left:auto}

/* ---- thẻ review ---- */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;margin-bottom:10px;position:relative;scroll-margin-top:170px;scroll-margin-bottom:20px}
.card.active{border-color:var(--blue);box-shadow:0 0 0 2px #d2e3fc}
.card.lab-Genuine{border-left:4px solid var(--g)}
.card.lab-Uncertain{border-left:4px solid var(--u)}
.card.lab-Spam{border-left:4px solid var(--s)}
.ch{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;flex:none}
.ch .w{flex:1;min-width:0}
.ch .nm{font-weight:500}
.ch .mt{font-size:12.5px;color:var(--sub)}
.lgb{color:#e37400;font-weight:500}
.ptag{font-size:12px;background:var(--bg);border-radius:10px;padding:2px 8px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{font-size:12px;font-weight:500;border-radius:10px;padding:2px 9px;white-space:nowrap}
.lb.Genuine{background:var(--g-l);color:var(--g)}
.lb.Uncertain{background:var(--u-l);color:var(--u)}
.lb.Spam{background:var(--s-l);color:var(--s)}
.cr{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);flex-wrap:wrap}
.ct{margin-top:6px;white-space:pre-wrap;word-wrap:break-word}
.ct.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ct mark{background:#fde293;border-radius:2px}
.more{color:var(--blue);font-weight:500;background:none;border:0;padding:0;font-size:13px}
.nott{color:var(--sub);font-style:italic;margin-top:6px}
.phs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ph{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;background:#e8eaed;cursor:zoom-in;flex:none;border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.dup{outline:3px solid var(--s);outline-offset:-3px}
.ph .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ph .dn{position:absolute;left:4px;bottom:4px;background:var(--s);color:#fff;font-size:11px;border-radius:8px;padding:0 6px}
.ph .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);text-align:center;padding:4px}
.own{margin-top:10px;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px}
.own b{font-weight:500}
.sigs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sig{border:1px solid;border-radius:14px;padding:2px 10px;font-size:12.5px;background:#fff;white-space:nowrap}
.sig.r{border-color:#f6aea9;color:#c5221f;background:#fff8f7}
.sig.o{border-color:#fdd663;color:#b06000;background:#fffbef}
.sig.b{border-color:#d2e3fc;color:#174ea6;background:#f8fbff}
.sig.on{box-shadow:inset 0 0 0 1px currentColor}
.ev{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafafa}
.ev h4{margin:0 0 6px;font-size:13px;font-weight:500}
.mini{border-top:1px solid #eceff1;padding:8px 0}
.mini:first-of-type{border-top:0}
.mini .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.mini .mh b{color:var(--txt);font-weight:500}
.mini .mx{margin-top:3px;white-space:pre-wrap;font-size:13px}
.tag{font-size:11px;border-radius:8px;padding:0 6px;background:#e8eaed;color:#3c4043}
.tag.hot{background:var(--s-l);color:var(--s)}
.pairs{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.pair{display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.pair .ph{width:72px;height:72px}

/* ---- thanh gán nhãn ---- */
.lab{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.fl{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12.5px;color:#3c4043}
.fl kbd,.lbtn kbd{font:11px ui-monospace,Menlo,monospace;color:var(--sub);margin-right:3px}
.fl:hover{background:#f8f9fa}
.fl.hint{border-style:dashed;border-color:#f29900;background:#fffbef}
.fl.on{background:#3c4043;border-color:#3c4043;color:#fff}
.fl.on kbd{color:#bdc1c6}
.lrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lbtn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 14px;font-weight:500}
.lbtn.g.on{background:var(--g);border-color:var(--g);color:#fff}
.lbtn.u.on{background:#e37400;border-color:#e37400;color:#fff}
.lbtn.s.on{background:var(--s);border-color:var(--s);color:#fff}
.lbtn.on kbd{color:rgba(255,255,255,.8)}
.rule{font-size:12.5px;color:var(--sub)}
.rule b{font-weight:500}
.warn{color:var(--u);font-size:12.5px}
.note{flex:1;min-width:180px;border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px;outline:0}
.note:focus{border-color:var(--blue)}

/* ---- trạng thái rỗng ---- */
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--sub)}
.empty h2{font-weight:400;color:var(--txt);margin:0 0 8px}
#sentinel{height:40px}

/* ---- lớp phủ ---- */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
#lb{background:rgba(0,0,0,.92);color:#fff;z-index:55}
#lb .stage{flex:1;height:100%;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
#lb img,#lb video{max-width:100%;max-height:100%;object-fit:contain}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:28px;width:48px;height:64px;border-radius:8px}
#lb .nav:hover{background:rgba(255,255,255,.25)}
#lb .prev{left:12px}#lb .next{right:12px}
#lb .close{position:absolute;top:10px;right:12px;background:none;border:0;color:#fff;font-size:28px;z-index:2}
#lb .info{width:320px;height:100%;background:#202124;overflow-y:auto;padding:18px 16px;font-size:13px}
#lb .info .muted{color:#9aa0a6}
#lb .info .ph{width:84px;height:84px}
#lb .cnt{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;color:#ccc}
#md{background:rgba(32,33,36,.55)}
#md .box{background:var(--bg);border-radius:14px;width:min(820px,94vw);max-height:90vh;overflow-y:auto;padding:16px 18px;position:relative}
#md .box h3{margin:0 0 10px;font-weight:500;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#md .box.white{background:#fff}
.help table{border-collapse:collapse;width:100%;font-size:13px}
.help td,.help th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.help kbd{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:6px;z-index:60;font-size:13px;max-width:80vw}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#fff;z-index:100;font-size:15px;color:var(--sub)}
.spin{width:36px;height:36px;border:4px solid #e8eaed;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){:root{--side:260px}#lb .info{display:none}}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div id="loadMsg">Đang giải nén dữ liệu…</div></div>

<header id="top">
  <div class="logo"><span class="pin"></span>Gắn nhãn review</div>
  <div class="grow"></div>
  <span id="prog"></span>
  <div class="who" title="Mỗi người gán nhãn có bộ nhãn riêng">Người gán: <b id="annotName">—</b>
    <button class="btn small ghost" data-act="annot">Đổi</button></div>
  <button class="btn" data-act="import" title="Nhập lại file đã xuất (tiếp tục trên máy khác / gộp nhãn)">⬆ Nhập</button>
  <button class="btn primary" data-act="export" title="Xuất CSV các review đã gán nhãn">⬇ Xuất CSV <span id="unsaved" class="badge" hidden></span></button>
  <button class="btn" data-act="help" title="Hướng dẫn & phím tắt (?)">? Hướng dẫn</button>
  <input type="file" id="fileIn" accept=".csv,.json" hidden>
</header>

<div id="app">
  <aside id="side">
    <div class="sh">
      <label class="search">🔍<input id="pq" placeholder="Tìm quán…" autocomplete="off"></label>
      <div class="sact"><span class="muted" id="selInfo"></span>
        <span><button class="btn small ghost" data-act="selAll" title="Chọn mọi quán đang hiện trong danh sách">Chọn hết</button><button class="btn small ghost" data-act="selNone">Bỏ chọn</button></span></div>
    </div>
    <div id="plist"></div>
  </aside>
  <main id="main"><div id="mainIn">
    <div id="head"></div>
    <div id="bar">
      <label class="search">🔍<input id="q" placeholder="Tìm trong nội dung review (không phân biệt dấu)…" autocomplete="off">
        <select id="scope" class="chip" title="Phạm vi tìm kiếm"><option value="sel">Quán đã chọn</option><option value="all">Toàn bộ dữ liệu</option></select></label>
      <div class="row" id="rowType"></div>
      <div class="row" id="rowSig"></div>
    </div>
    <div id="list"></div>
    <div id="sentinel"></div>
  </div></main>
</div>

<div id="lb" class="ovl" hidden></div>
<div id="md" class="ovl" hidden></div>
<div id="toast" hidden></div>

<script id="meta" type="application/json">__META__</script>
<script id="data" type="text/plain">__DATA__</script>
<script>
'use strict';
const META = JSON.parse(document.getElementById('meta').textContent);
const FL = META.flags, NF = FL.length, HOST = META.host;
const LABELS = [
  {k: 'Genuine', vi: 'Thật', key: 't', cls: 'g'},
  {k: 'Uncertain', vi: 'Chưa chắc', key: 'c', cls: 'u'},
  {k: 'Spam', vi: 'Giả / Spam', key: 'g', cls: 's'},
];
const LVI = Object.fromEntries(LABELS.map(l => [l.k, l.vi]));
const PAGE = 30;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dDate = d => new Date(d * 864e5);
const fmtDay = d => d == null ? '' : `${pad(dDate(d).getUTCDate())}/${pad(dDate(d).getUTCMonth() + 1)}/${dDate(d).getUTCFullYear()}`;
const isoDay = d => d == null ? '' : dDate(d).toISOString().slice(0, 10);
const num = n => n == null ? '?' : Number(n).toLocaleString('vi-VN');
const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const img = (code, size) => HOST + code + (size ? '=' + size : '');
const starsHTML = r => r == null ? '' : `<span class="stars">${'★'.repeat(r)}<span class="off">${'★'.repeat(5 - r)}</span></span>`;
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

// ---------------------------------------------------------------- dữ liệu
let R, PL, NR, idIdx, byPlace, byUser, byDup, byImg, hasT, hasM, placeDay, placeDayR, placeAvg, USERS, FOLD;
const SIG = [];

async function loadData() {
  const b64 = document.getElementById('data').textContent.trim();
  const s = atob(b64);
  const bin = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bin[i] = s.charCodeAt(i);
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

function index(D) {
  R = D.reviews; PL = D.places; USERS = D.users; NR = R.id.length;
  idIdx = new Map(); byPlace = PL.k.map(() => []); byUser = new Map(); byDup = new Map(); byImg = new Map();
  hasT = new Uint8Array(NR); hasM = new Uint8Array(NR);
  placeDay = PL.k.map(() => new Map()); placeDayR = PL.k.map(() => new Map());
  const lo = PL.k.map(() => Infinity), hi = PL.k.map(() => -Infinity);
  const push = (m, k, v) => { let a = m.get(k); if (!a) m.set(k, a = []); a.push(v); };
  for (let i = 0; i < NR; i++) {
    const p = R.p[i];
    idIdx.set(R.id[i], i); byPlace[p].push(i);
    hasT[i] = R.t[i].trim() ? 1 : 0; hasM[i] = R.m[i] ? 1 : 0;
    if (R.u[i] >= 0) push(byUser, R.u[i], i);
    if (R.dc[i] != null) push(byDup, R.dc[i], i);
    if (R.m[i]) R.m[i].forEach((mm, j) => { if (mm[2] >= 0) push(byImg, mm[2], [i, j]); });
    const d = R.dy[i];
    if (d != null) {
      placeDay[p].set(d, (placeDay[p].get(d) || 0) + 1);
      placeDayR[p].set(d, (placeDayR[p].get(d) || 0) + (R.r[i] || 0));
      if (d < lo[p]) lo[p] = d; if (d > hi[p]) hi[p] = d;
    }
  }
  placeAvg = PL.k.map((_, p) => byPlace[p].length / Math.max(hi[p] - lo[p], 1));
}

function labelable(i) { return hasT[i] || hasM[i]; }

function signals(i) {
  if (SIG[i]) return SIG[i];
  const s = {}, p = R.p[i], u = R.u[i], d = R.dy[i], r = R.r[i];
  const other = j => R.u[j] !== u || u < 0 || R.p[j] !== p;     // khác tài khoản hoặc khác quán
  s.dup = R.dc[i] == null ? [] : byDup.get(R.dc[i]).filter(j => j !== i);
  s.dupPlaces = new Set(s.dup.map(j => R.p[j]).filter(q => q !== p)).size;
  const im = new Set();
  if (R.m[i]) R.m[i].forEach(mm => { if (mm[2] >= 0) byImg.get(mm[2]).forEach(([j]) => { if (j !== i) im.add(j); }); });
  s.img = [...im];
  s.imgPlaces = new Set(s.img.map(j => R.p[j]).filter(q => q !== p)).size;
  s.user = u >= 0 ? byUser.get(u).filter(j => j !== i) : [];
  s.userPlaces = new Set(s.user.map(j => R.p[j])).size;
  if (d != null) {
    let n = 0, rs = 0;

function timelineHTML(set) {

    if (UI.period && (R.dy[i] == null || R.dy[i] < UI.period.from || R.dy[i] > UI.period.to)) continue;

const COLS = ['annotator', 'review_id', 'place_key', 'place_name', 'rating', 'review_day', 'has_text', 'has_image', 'n_media',
  ...FL.map(x => x.key), 'label', 'label_theo_luat', 'ghi_chu', 'labeled_at', 'text_dup_group', 'n_text_dup', 'n_img_dup', 'text'];
const csvCell = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportCSV() {
  const rows = [COLS.join(',')];
  let n = 0, unknown = 0;
  for (const id in L) {
    const e = L[id]; if (!e.l) continue;
    const i = idIdx.get(id);
    if (i == null) { unknown++; continue; }
    const s = signals(i);
    rows.push([ANNOT, id, PL.k[R.p[i]], PL.n[R.p[i]], R.r[i], isoDay(R.dy[i]), hasT[i], hasM[i], R.m[i] ? R.m[i].length : 0,
      ...e.f.slice(0, NF), e.l, ruleLabel(e.f), e.n || '', e.t || '', R.dc[i] ?? '', s.dup.length, s.img.length, R.t[i]].map(csvCell).join(','));
    n++;
  }
  if (!n) { toast('Chưa có review nào được gán nhãn'); return; }
  const d = new Date(), stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  download(`nhan_review_${ANNOT}_${stamp}.csv`, '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  LS.set('exported:' + ANNOT, new Date().toISOString());
  updateProgress();
  toast(`Đã xuất ${n} nhãn${unknown ? ` (bỏ qua ${unknown} nhãn của review không có trong dữ liệu này)` : ''}`);
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0]);
}
function importFile(file) {

      } else {
        const rows = parseCSV(rd.result), h = rows.shift(), col = k => h.indexOf(k);
        if (col('review_id') < 0 || col('label') < 0) throw new Error('thiếu cột review_id / label');
        const norm = {genuine: 'Genuine', uncertain: 'Uncertain', spam: 'Spam', 'thật': 'Genuine', 'chưa chắc': 'Uncertain', 'giả': 'Spam'};
        for (const r of rows) {
          const id = r[col('review_id')]; if (!id) continue;
          const l = norm[(r[col('label')] || '').trim().toLowerCase()] || null;
          incoming[id] = {f: FL.map(x => col(x.key) >= 0 && +r[col(x.key)] === 1 ? 1 : 0), l,
                          n: col('ghi_chu') >= 0 ? r[col('ghi_chu')] : '', t: col('labeled_at') >= 0 ? r[col('labeled_at')] : null};
        }
      }
    } catch (err) { toast('Không đọc được file: ' + err.message, 6000); return; }
    let add = 0, upd = 0, keep = 0;
    for (const id in incoming) {
      const a = incoming[id], b = L[id];
      if (!b || !b.l) { L[id] = a; add++; }
      else if ((a.t || '') > (b.t || '')) { L[id] = a; upd++; }
      else keep++;
    }
    saveLabels(); renderSide(); applyView(true);
    toast(`Đã nhập: ${add} mới, ${upd} cập nhật (mới hơn), ${keep} giữ nguyên`, 5000);
  };
  rd.readAsText(file, 'utf-8');
}

let toastT = null;
function toast(msg, ms = 3000) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

// ---------------------------------------------------------------- sự kiện
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  const card = ev.target.closest('[data-card]');
  if (card && !card.dataset.modal && !ev.target.closest('input,textarea')) setActive(+card.dataset.card, false);
  if (!a) {
    if (ev.target.id === 'md' && ANNOT) closeModal();
    if (ev.target.classList && ev.target.classList.contains('stage')) { LBX = null; renderLB(); }
    return;
  }
  const act = a.dataset.act, i = a.dataset.i != null ? +a.dataset.i : null;
  switch (act) {
    case 'place': {
      if (ev.target.closest('input')) return;
      const p = +a.dataset.p; UI.sel = [p]; UI.period = null; UI.rating = 0;
      if (UI.scope === 'all') { UI.scope = 'sel'; $('#scope').value = 'sel'; }
      renderSide(); applyView(); break;
    }
    case 'pcheck': {
      const p = +a.dataset.p;
      UI.sel = a.checked ? [...new Set([...UI.sel, p])] : UI.sel.filter(x => x !== p);
      renderSide(); applyView(); break;
    }
    case 'grp': UI.collapsed[a.dataset.g] = !UI.collapsed[a.dataset.g]; saveUI(); renderSide(); break;
    case 'selAll': {
      const q = fold(UI.pq.trim());
      UI.sel = PL.k.map((_, p) => p).filter(p => !q || fold(PL.n[p]).includes(q) || fold(PL.q[p]).includes(q));
      renderSide(); applyView(); break;
    }
    case 'selNone': UI.sel = []; renderSide(); applyView(); break;
    case 'type': UI[a.dataset.v] = !UI[a.dataset.v]; applyView(); break;
    case 'status': UI.status = a.dataset.v; applyView(); break;
    case 'sig': UI.sig = a.dataset.v; applyView(); break;
    case 'rating': UI.rating = UI.rating === +a.dataset.r ? 0 : +a.dataset.r; applyView(true); break;
    case 'clrRating': UI.rating = 0; applyView(true); break;
    case 'period': {
      const f = +a.dataset.from, t = +a.dataset.to;
      UI.period = UI.period && UI.period.from === f && UI.period.to === t ? null : {from: f, to: t, lbl: a.dataset.lbl};
      applyView(true); break;
    }
    case 'clrPeriod': UI.period = null; applyView(true); break;
    case 'more': {
      const t = a.previousElementSibling; t.classList.toggle('clamp');
      a.textContent = t.classList.contains('clamp') ? 'Xem thêm' : 'Thu gọn'; break;
    }
    case 'flag': toggleFlag(i, +a.dataset.k); break;
    case 'label': setLabel(i, a.dataset.l); break;
    case 'acceptHints': acceptHints(i); break;
    case 'ev': {
      const c = a.closest('[data-card]'), slot = $('.evslot', c), k = a.dataset.k;
      $$('.sig', c).forEach(x => x.classList.remove('on'));
      if (slot.dataset.k === k) { slot.innerHTML = ''; slot.dataset.k = ''; }
      else { slot.innerHTML = evHTML(i, k); slot.dataset.k = k; a.classList.add('on'); }
      break;
    }
    case 'propagate': propagate(i); break;
    case 'burstView': {
      closeModal();
      const d = R.dy[i];
      UI.sel = [R.p[i]]; UI.scope = 'sel'; $('#scope').value = 'sel';
      UI.period = {from: d - 3, to: d + 3, lbl: `${fmtDay(d - 3)} – ${fmtDay(d + 3)}`};
      renderSide(); applyView(); break;
    }
    case 'open': openReview(i); break;
    case 'lb': openLB(i, +a.dataset.j); break;
    case 'lbJump': openLB(i, +a.dataset.j); break;
    case 'lbPrev': LBX.j = (LBX.j - 1 + R.m[LBX.i].length) % R.m[LBX.i].length; renderLB(); break;
    case 'lbNext': LBX.j = (LBX.j + 1) % R.m[LBX.i].length; renderLB(); break;
    case 'lbClose': LBX = null; renderLB(); break;
    case 'mdClose': closeModal(); break;
    case 'help': showBox(helpHTML()); break;
    case 'annot': askAnnot(false); break;
    case 'export': exportCSV(); break;
    case 'import': $('#fileIn').click(); break;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'sort') { UI.sort = ev.target.value; applyView(); }
  if (ev.target.id === 'adv') { UI.advance = ev.target.checked; saveUI(); }
  if (ev.target.id === 'scope') { UI.scope = ev.target.value; applyView(); }
  if (ev.target.id === 'fileIn' && ev.target.files[0]) { importFile(ev.target.files[0]); ev.target.value = ''; }
});
let noteT = null, qT = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.classList.contains('note') && t.dataset.i != null) {
    clearTimeout(noteT);
    noteT = setTimeout(() => {
      const i = +t.dataset.i, e = ensure(i); e.n = t.value; touch(e); saveLabels();
      $$(`[data-card="${i}"] .note`).forEach(n => { if (n !== t) n.value = t.value; });
      const w = t.parentElement.querySelector('.warn'); if (w && t.value.trim()) w.remove();
    }, 300);
  }
  if (t.id === 'q') { clearTimeout(qT); qT = setTimeout(() => { UI.q = t.value; applyView(); }, 250); }
  if (t.id === 'pq') { UI.pq = t.value; renderSide(); }
});
document.addEventListener('error', ev => {
  const t = ev.target;
  if (t.tagName === 'IMG' && t.parentElement && t.parentElement.classList.contains('ph') && !t.dataset.failed) {
    t.dataset.failed = 1; t.style.visibility = 'hidden';
    t.insertAdjacentHTML('afterend', '<span class="err">Không tải được ảnh (cần mạng)</span>');
  }
}, true);
document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (ev.target.classList.contains('note') && (ev.key === 'Enter' || ev.key === 'Escape')) { ev.target.blur(); ev.preventDefault(); }
    else if (ev.key === 'Escape') ev.target.blur();
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (LBX) {
    if (k === 'escape') { LBX = null; renderLB(); }
    else if (k === 'arrowleft') $('[data-act="lbPrev"]')?.click();
    else if (k === 'arrowright') $('[data-act="lbNext"]')?.click();
    return;
  }
  if (k === 'escape') { if (MODAL !== -1 && ANNOT) closeModal(); return; }
  if (MODAL === -2) return;
  if (k === '?') { showBox(helpHTML()); return; }
  if (k === '/') { ev.preventDefault(); $('#q').focus(); return; }
  if (k === 'j') { move(1); ev.preventDefault(); return; }
  if (k === 'k') { move(-1); ev.preventDefault(); return; }
  const i = target();
  if (i < 0) { if (/^[1-7tcgaxnoe]$/.test(k)) { move(0); } else return; }
  const t = target();
  if (t < 0) return;
  if (/^[1-7]$/.test(k) && +k <= NF) toggleFlag(t, +k - 1);
  else if (k === 't') setLabel(t, 'Genuine', true);
  else if (k === 'c') setLabel(t, 'Uncertain', true);
  else if (k === 'g') setLabel(t, 'Spam', true);
  else if (k === 'a') acceptHints(t);
  else if (k === 'x') { const e = entry(t); if (e) { e.l = null; touch(e); saveLabels(); refreshCard(t); renderSideSoon(); } }
  else if (k === 'n') { ev.preventDefault(); $(`${MODAL >= 0 ? '#md' : '#c' + t} .note`)?.focus(); }
  else if (k === 'o') { if (R.m[t]) openLB(t, 0); }
  else if (k === 'e') { $(`${MODAL >= 0 ? '#md' : '#c' + t} .sig[data-act="ev"]`)?.click(); }
});
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) renderMore(); }, {root: $('#main'), rootMargin: '600px'}).observe($('#sentinel'));

// ---------------------------------------------------------------- khởi động
(async () => {
  try {
    if (typeof DecompressionStream === 'undefined') throw new Error('Trình duyệt quá cũ — hãy dùng Chrome, Edge, Firefox hoặc Safari bản mới');
    index(await loadData());
  } catch (err) {
    $('#loadMsg').innerHTML = '❌ Không mở được dữ liệu: ' + esc(err.message);
    $('.spin').remove();
    return;
  }
  UI.sel = UI.sel.filter(p => p < PL.k.length);
  $('#q').value = UI.q; $('#pq').value = UI.pq; $('#scope').value = UI.scope;
  loadLabels();
  $('#annotName').textContent = ANNOT || '—';
  renderSide(); applyView(); updateProgress();
  $('#loading').remove();
  if (!ANNOT) askAnnot(true);
  try { localStorage.setItem('gnr:test', '1'); localStorage.removeItem('gnr:test'); }
  catch { storageOK = false; toast('⚠ Trình duyệt không cho lưu tự động — hãy bấm "Xuất CSV" thường xuyên', 8000); }
})();
</script>
